<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI Calculator</title>
</head>
<body>
    <center>
        <h1 style="color:brown; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Simple Interest Calculator</h1>
        <form method="post">
            <input type="number" step="any" name="p" placeholder="Principal Amount" required>
            <input type="number" step="any" name="t" placeholder="Time" required>
            <input type="number" step="any" name="r" placeholder="Rate" required><br><br>
            <button style="color: blue; font-family: Arial, Helvetica, sans-serif;">Calculate SI</button>
        </form>
    </center>
    {# Display Output #}
    {% if SI %}
    <hr>
    <h3>Result:</h3>
    <span>Principle : {{ p }}</span><br>
    <span>Time : {{ t }}</span><br>
    <span>Rate : {{ r }}</span><br>
    <span>
        <b>Simple Interest - {{ SI }}</b><br>
        <b>Total Amount - {{ total }}</b>
    </span>
    {% endif %}
</body>
</html>
